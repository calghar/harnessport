name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Build first: the CLI-level tests assert exit codes and stdout/stderr routing against
      # dist/index.js, and skip themselves when it is absent. Running check first silently
      # skipped 21 of them.
      - run: npm run build

      - run: npm run check
