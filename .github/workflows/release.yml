name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      - run: npm run check

      # No continue-on-error. A failed publish used to leave this workflow green while npm kept
      # serving the previous version.
      - name: Publish to npm
        run: npm publish

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify npm serves the published version
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            published=$(npm view "harnessport@$expected" version --prefer-online 2>/dev/null || echo "")
            [ "$published" = "$expected" ] && echo "npm serves harnessport@$published" && exit 0
            echo "attempt $attempt: harnessport@$expected is not visible"
            sleep 10
          done
          echo "::error::npm never served harnessport@$expected"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
