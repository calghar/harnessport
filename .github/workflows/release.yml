name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

      - run: npm run check

      # No continue-on-error. A failed publish used to leave this workflow green while npm kept
      # serving the previous version.
      - name: Publish to npm
        run: npm publish

      # Trust the registry, not the exit code.
      - name: Verify the registry serves this tag
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 10); do
            published=$(npm view harnessport version 2>/dev/null || echo "")
            [ "$published" = "$expected" ] && echo "npm serves $published" && exit 0
            echo "attempt $attempt: npm serves '${published:-nothing}', want $expected"
            sleep 6
          done
          echo "::error::npm never served $expected"
          exit 1

      # Last, so a release is never announced for a version nobody can install.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
